    smooth-scroll: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
        <!-- Google Analytics: Measurement ID G-94BTH13ZJ6 (edupluszone.com) -->
        <script>(function(){var ID="G-94BTH13ZJ6";if(/X{6}/.test(ID)||/^(localhost|127\.)/.test(location.hostname))return;var s=document.createElement("script");s.async=true;s.src="https://www.googletagmanager.com/gtag/js?id="+ID;document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag("js",new Date());gtag("config",ID);})();</script>
